services:
  github-trend-intelligence-postgres:
    image: postgres:18.1
    container_name: github-trend-intelligence-postgres
    environment:
      POSTGRES_DB: github_trend
      POSTGRES_USER: github_trend
      POSTGRES_PASSWORD: github_trend_local_only
      TZ: Asia/Shanghai
    ports:
      - "35432:5432"
    volumes:
      - github-trend-intelligence-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U github_trend -d github_trend"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  github-trend-intelligence-postgres-data:

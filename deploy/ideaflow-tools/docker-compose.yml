services:
  github-trend-intelligence:
    container_name: github-trend-intelligence
    build:
      context: ../..
      dockerfile: Dockerfile
    image: github-trend-intelligence:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3310
    expose:
      - "3310"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3310/github-trend-intelligence/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - app-net

networks:
  app-net:
    external: true
